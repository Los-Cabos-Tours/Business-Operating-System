<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Aetherion — BOS</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #070F1C; overflow: hidden; }
    #bos-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <iframe id="bos-frame" src="crm.html" title="Aetherion"></iframe>
  <script>
    (function () {
      var frame = document.getElementById('bos-frame');

      // Branding patch — ONLY "Los Cabos Tours" becomes "BOS".
      // Aetherion remains the platform brand name.
      function patchDoc(doc) {
        try {
          if (doc.title.indexOf('Los Cabos Tours') !== -1) {
            doc.title = 'Aetherion — BOS';
          }
          var s = doc.querySelector('.login-subtitle');
          if (s && s.textContent.indexOf('Los Cabos Tours') !== -1) s.textContent = 'BOS';
          var f = doc.querySelector('.login-footer');
          if (f && f.textContent.indexOf('Los Cabos Tours') !== -1) {
            f.textContent = 'Authorized personnel only • BOS • All activity is logged';
          }
        } catch (e) { /* frame not ready */ }
      }

      function start() {
        var doc = null;
        try { doc = frame.contentDocument; } catch (e) { return; }
        if (!doc || !doc.documentElement) return;
        patchDoc(doc);
        var overlay = doc.getElementById('login-overlay');
        if (overlay && window.MutationObserver) {
          new MutationObserver(function () { patchDoc(doc); })
            .observe(overlay, { childList: true, subtree: true });
        }
      }

      frame.addEventListener('load', start);
    })();
  </script>
</body>
</html>
