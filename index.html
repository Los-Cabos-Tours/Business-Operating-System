<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Aetherion — BOS</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #070F1C; overflow: hidden; }
    #bos-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <!-- Cross-device login: pulls the shared user-account list from the
       configured sync backend into this browser's storage before login
       is attempted, so any account works on any computer or device.
       Same-origin with crm.html: both share the same localStorage. -->
  <script src="js/cross-device-login.js"></script>
  <!-- Boot sync: pulls ALL shared data (main BOS + Student Loans) from
       the configured sync backend before the app opens, so every
       device shows the same information. Also auto-enables SLF sync
       on every device (owner order: one shared backend, all data
       shared with all users). -->
  <script src="js/boot-sync.js"></script>
  <iframe id="bos-frame" src="crm.html" title="Aetherion"></iframe>
  <script>
    (function () {
      var frame = document.getElementById('bos-frame');

      function patchDoc(doc) {
        try {
          if (doc.title.indexOf('Los Cabos Tours') !== -1) {
            doc.title = 'Aetherion — BOS';
          }
          var s = doc.querySelector('.login-subtitle');
          if (s && s.textContent.indexOf('Los Cabos Tours') !== -1) s.textContent = 'BOS';
          var f = doc.querySelector('.login-footer');
          if (f && f.textContent.indexOf('Los Cabos Tours') !== -1) {
            f.textContent = 'Authorized personnel only • BOS • All activity is logged';
          }
        } catch (e) { /* frame not ready */ }
      }

      function addSlfTab(doc) {
        try {
          if (doc.getElementById('nav-slf')) return;
          var menu = doc.querySelector('.sidebar-menu');
          if (!menu) return;
          // Access is controlled by WHO HAS AN ACCOUNT, not by role
          // name: any logged-in user sees the tab. The user (owner)
          // decides per person whether they get a login and what they
          // can do inside. Login state is detected by the user chip
          // shown in the sidebar; the login overlay hides it.
          var overlay = doc.getElementById('login-overlay');
          var overlayVisible = !!(overlay && overlay.offsetParent !== null);
          if (overlayVisible) return; // not logged in yet
          var li = doc.createElement('li');
          li.className = 'menu-item';
          li.id = 'nav-slf';
          var a = doc.createElement('a');
          a.href = 'slf/index.html';
          a.target = '_blank';
          var icon = doc.createElement('i');
          icon.className = 'ti ti-school';
          var div = doc.createElement('div');
          var span = doc.createElement('span');
          span.textContent = 'Student Loans';
          var sub = doc.createElement('div');
          sub.className = 'nav-sub';
          sub.textContent = 'Student loan CRM';
          div.appendChild(span);
          div.appendChild(sub);
          a.appendChild(icon);
          a.appendChild(div);
          li.appendChild(a);
          menu.appendChild(li);
        } catch (e) { /* frame not ready */ }
      }

      function start() {
        var doc = null;
        try { doc = frame.contentDocument; } catch (e) { return; }
        if (!doc || !doc.documentElement) return;
        patchDoc(doc);
        addSlfTab(doc);
        var overlay = doc.getElementById('login-overlay');
        if (overlay && window.MutationObserver) {
          new MutationObserver(function () { patchDoc(doc); addSlfTab(doc); })
            .observe(overlay, { childList: true, subtree: true });
        }
        if (doc.body && window.MutationObserver) {
          new MutationObserver(function () { addSlfTab(doc); })
            .observe(doc.body, { childList: true, subtree: true });
        }
      }

      frame.addEventListener('load', start);
    })();
  </script>
</body>
</html>
